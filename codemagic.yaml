workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      xcode: 26.0
      node: 22.14.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.nooitmeerpostkwijt.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Create placeholder web dir
        script: mkdir -p capacitor-web && echo '<!DOCTYPE html><html><body></body></html>' > capacitor-web/index.html
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Restore app icon
        script: cp resources/icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      node: 22.14.0
      java: 21
      android_signing:
        - nooitmeerpostkwijt
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Create placeholder web dir
        script: mkdir -p capacitor-web && echo '<!DOCTYPE html><html><body></body></html>' > capacitor-web/index.html
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build AAB
        script: |
          cd android && ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
